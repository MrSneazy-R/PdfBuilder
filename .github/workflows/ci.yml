name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: ${{ matrix.name }} build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install PDF validation tools and multilingual fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fontconfig fonts-noto-core poppler-utils qpdf
          fc-cache --force
          fc-match :lang=ar
      - name: Restore maintained projects
        run: |
          dotnet restore PdfBuilder.sln
          dotnet restore tests/PdfBuilder.Tests/PdfBuilder.Tests.csproj
          dotnet restore tests/PdfBuilder.ValidationTests/PdfBuilder.ValidationTests.csproj
          dotnet restore samples/HBSubsetProbe/HBSubsetProbe.csproj
          dotnet restore samples/SimpleRenderCheck/SimpleRenderCheck.csproj
          dotnet restore samples/TablePerfSample/TablePerfSample.csproj
      - name: Verify formatting
        run: |
          dotnet format PdfBuilder.sln --verify-no-changes --no-restore
          dotnet format tests/PdfBuilder.Tests/PdfBuilder.Tests.csproj --verify-no-changes --no-restore
          dotnet format tests/PdfBuilder.ValidationTests/PdfBuilder.ValidationTests.csproj --verify-no-changes --no-restore
      - name: Build Debug
        run: dotnet build PdfBuilder.sln -c Debug --no-restore
      - name: Build Release (report warnings)
        run: dotnet build PdfBuilder.sln -c Release --no-restore
      - name: Build maintained samples
        run: |
          dotnet build samples/HBSubsetProbe/HBSubsetProbe.csproj -c Release --no-restore
          dotnet build samples/SimpleRenderCheck/SimpleRenderCheck.csproj -c Release --no-restore
          dotnet build samples/TablePerfSample/TablePerfSample.csproj -c Release --no-restore
      - name: Run unit tests
        run: dotnet test tests/PdfBuilder.Tests/PdfBuilder.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Run independent PDF validation
        if: runner.os == 'Linux'
        env:
          PDFBUILDER_VISUAL_FAILURE_DIRECTORY: ${{ github.workspace }}/ValidationFailures
        run: dotnet test tests/PdfBuilder.ValidationTests/PdfBuilder.ValidationTests.csproj -c Release --no-restore --logger "trx;LogFileName=pdf-validation.trx" --results-directory TestResults
      - name: Upload test and visual-regression artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-test-results
          path: |
            TestResults/**/*.trx
            ValidationFailures/**/*.png
          if-no-files-found: warn

  package-smoke:
    name: ${{ matrix.name }} package consumer smoke test
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and pack
        run: |
          dotnet restore PdfBuilder.sln
          dotnet pack PdfBuilder.csproj -c Release --no-restore -o ./artifacts
      - name: Package consumer smoke test
        shell: pwsh
        run: ./eng/Invoke-PackageSmokeTest.ps1 -PackageDirectory ./artifacts
      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
