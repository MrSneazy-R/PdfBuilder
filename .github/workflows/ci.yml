name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Windows build, test, and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore PdfBuilder.sln
      - name: Verify formatting
        run: dotnet format PdfBuilder.sln --verify-no-changes --no-restore
      - name: Build Debug
        run: dotnet build PdfBuilder.sln -c Debug --no-restore
      - name: Build Release (report warnings)
        run: dotnet build PdfBuilder.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/PdfBuilder.Tests/PdfBuilder.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Pack
        run: dotnet pack PdfBuilder.csproj -c Release --no-restore -o ./artifacts
      - name: Package consumer smoke test
        shell: pwsh
        run: ./eng/Invoke-PackageSmokeTest.ps1 -PackageDirectory ./artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  ubuntu-native-runtime-diagnostics:
    name: Ubuntu native runtime diagnostics
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore and build
        run: |
          dotnet restore PdfBuilder.sln
          dotnet build PdfBuilder.sln -c Release --no-restore
      - name: Run tests and classify native-runtime failures
        shell: bash
        run: |
          set +e
          dotnet test tests/PdfBuilder.Tests/PdfBuilder.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=ubuntu-tests.trx" --results-directory TestResults 2>&1 | tee ubuntu-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -Eiq 'DllNotFoundException|libHarfBuzzSharp|libSkiaSharp|PlatformNotSupportedException' ubuntu-test.log; then
            echo "::warning::Ubuntu test failure is a native-runtime diagnostic. See documentation/engineering/BASELINE.md."
            exit 0
          fi
          exit "$status"
      - name: Upload Ubuntu diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-native-runtime-diagnostics
          path: |
            TestResults/**/*.trx
            ubuntu-test.log
          if-no-files-found: warn
