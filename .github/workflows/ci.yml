name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  unit-tests:
    name: ${{ matrix.name }} unit tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore PdfBuilder.sln
      - name: Build solution
        run: dotnet build PdfBuilder.sln -c Release --no-restore -warnaserror
      - name: Run unit tests
        run: dotnet test tests/PdfBuilder.Tests/PdfBuilder.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-unit-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PdfBuilder.sln
      - run: dotnet format PdfBuilder.sln --verify-no-changes --no-restore

  ubuntu-pdf-validation:
    name: Ubuntu QPDF and Poppler validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install independent PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf poppler-utils
      - name: Restore validation tests
        run: dotnet restore tests/PdfBuilder.ValidationTests/PdfBuilder.ValidationTests.csproj
      - name: Run independent validation
        env:
          PDFBUILDER_VISUAL_FAILURE_DIRECTORY: ${{ github.workspace }}/ValidationFailures
        run: dotnet test tests/PdfBuilder.ValidationTests/PdfBuilder.ValidationTests.csproj -c Release --no-restore --logger "trx;LogFileName=pdf-validation.trx" --results-directory TestResults
      - name: Upload independent validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-pdf-validation-artifacts
          path: |
            TestResults/**/*.trx
            ValidationFailures/**/*.png
          if-no-files-found: warn

  package-smoke:
    name: ${{ matrix.name }} package smoke test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PdfBuilder.csproj
      - name: Pack
        run: dotnet pack PdfBuilder.csproj -c Release --no-restore -o ./artifacts
      - name: Consume package and render PDF
        shell: pwsh
        run: ./eng/Invoke-PackageSmokeTest.ps1 -PackageDirectory ./artifacts
      - name: Upload packages
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error
