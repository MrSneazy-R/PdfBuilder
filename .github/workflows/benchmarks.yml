name: Benchmarks
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
jobs:
  benchmark:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet run -c Release --project benchmarks/PdfBuilder.Benchmarks
      - uses: actions/upload-artifact@v4
        with: { name: benchmarks, path: BenchmarkDotNet.Artifacts }
