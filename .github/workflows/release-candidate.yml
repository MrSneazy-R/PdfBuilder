name: Internal pre-release draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Pre-release package version, for example 0.1.0-preview.2
        required: true
        default: 0.1.0-preview.2
      tag:
        description: Draft release tag
        required: true
        default: v0.1.0-preview.2

permissions:
  contents: write

jobs:
  validate-and-draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Validate pre-release version and tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content PdfBuilder.csproj -Raw
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ('${{ inputs.version }}' -ne $projectVersion) { throw "Version must match PdfBuilder.csproj ($projectVersion)." }
          if ('${{ inputs.tag }}' -ne "v$projectVersion") { throw "Tag must be v$projectVersion." }
          if ($projectVersion -notmatch '-') { throw 'Stable release labels remain blocked.' }
          if ($projectVersion -match '^1\.0\.0-rc(?:\.|$)') { throw '1.0.0 RC labels remain blocked by unresolved mandatory gates.' }
      - name: Install independent PDF validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes fontconfig fonts-noto-core poppler-utils qpdf
          fc-cache --force
      - name: Restore, format, build, and test
        run: |
          dotnet restore PdfBuilder.sln
          dotnet restore tests/PdfBuilder.Tests/PdfBuilder.Tests.csproj
          dotnet restore tests/PdfBuilder.ValidationTests/PdfBuilder.ValidationTests.csproj
          dotnet format PdfBuilder.sln --verify-no-changes --no-restore
          dotnet build PdfBuilder.sln -c Release --no-restore -warnaserror
          dotnet test tests/PdfBuilder.Tests/PdfBuilder.Tests.csproj -c Release --no-restore
          dotnet test tests/PdfBuilder.ValidationTests/PdfBuilder.ValidationTests.csproj -c Release --no-restore
      - name: Pack
        run: dotnet pack PdfBuilder.csproj -c Release --no-restore -p:Version=${{ inputs.version }} -o artifacts
      - name: Package consumer smoke test
        shell: pwsh
        run: ./eng/Invoke-PackageSmokeTest.ps1 -PackageDirectory ./artifacts
      - name: Verify package contents, docs, symbols, and repository metadata
        shell: pwsh
        run: ./eng/Test-PackageContents.ps1 -PackageDirectory ./artifacts
      - name: Generate SBOM and checksums
        shell: pwsh
        run: ./eng/New-ReleaseArtifacts.ps1 -PackageDirectory ./artifacts -Version '${{ inputs.version }}'
      - name: Create draft release without NuGet publication
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: ${{ inputs.tag }}
          name: PdfBuilder ${{ inputs.version }}
          body: |
            Draft pre-release artefacts for controlled internal evaluation only.
            This is not a stable release or a 1.0 release candidate. Public NuGet
            publication requires exact-commit evidence, explicit owner approval,
            and an approved PdfBuilder licence.
          files: artifacts/*
