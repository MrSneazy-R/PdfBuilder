name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Pre-release package version, for example 0.1.0-preview.2
        required: true
        default: 0.1.0-preview.2
      tag:
        description: Draft release tag
        required: true
        default: v0.1.0-preview.2

permissions:
  contents: write

jobs:
  validate-and-draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install independent PDF validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes fontconfig fonts-noto-core poppler-utils qpdf
          fc-cache --force
      - name: Restore, format, build, and test
        run: |
          dotnet restore PdfBuilder.sln
          dotnet restore tests/PdfBuilder.Tests/PdfBuilder.Tests.csproj
          dotnet restore tests/PdfBuilder.ValidationTests/PdfBuilder.ValidationTests.csproj
          dotnet format PdfBuilder.sln --verify-no-changes --no-restore
          dotnet build PdfBuilder.sln -c Release --no-restore -warnaserror
          dotnet test tests/PdfBuilder.Tests/PdfBuilder.Tests.csproj -c Release --no-restore
          dotnet test tests/PdfBuilder.ValidationTests/PdfBuilder.ValidationTests.csproj -c Release --no-restore
      - name: Pack and checksum
        run: |
          dotnet pack PdfBuilder.csproj -c Release --no-restore -p:Version=${{ inputs.version }} -o artifacts
          sha256sum artifacts/*.nupkg artifacts/*.snupkg > artifacts/checksums.sha256
      - name: Package consumer smoke test
        shell: pwsh
        run: ./eng/Invoke-PackageSmokeTest.ps1 -PackageDirectory ./artifacts
      - name: Verify package contents, docs, symbols, and repository metadata
        shell: pwsh
        run: ./eng/Test-PackageContents.ps1 -PackageDirectory ./artifacts
      - name: Create draft release without NuGet publication
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: ${{ inputs.tag }}
          name: PdfBuilder ${{ inputs.version }}
          body: |
            Private release-candidate artefacts only. Public NuGet publication requires
            explicit owner approval and an approved licence.
          files: artifacts/*
